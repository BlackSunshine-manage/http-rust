name: Rust

on:
  push:
    branches: [ "dev", "master" ]
  pull_request:
    branches: [ "dev", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: install dependency
      run: cargo install cargo-llvm-cov
      
    - name: check versions
      run: |
        rustup --version
        cargo --version
        cargo llvm-cov --version
    - uses: actions/checkout@v4
    
    - name: Build
      run: cargo build --verbose
      
    - name: Run tests with coverage and check thresholds
      run: |
        cargo llvm-cov \
          --lib --bins --tests \
          --lcov --output-path ./lcov.info \
          --fail-under-lines 33 \
          --fail-under-functions 33

    - name: Generate HTML coverage report (from existing data)
      run: cargo llvm-cov --html --output-dir ./target/coverage

    - name: Upload coverage report as artifact (optional)
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./target/coverage
